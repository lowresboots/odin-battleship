<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BattleBoot</title>
</head>

<body>
  <div id="game-container">
    <div id="placement-screen">
      <h2 id="placement-instructions">Place your Carrier</h2>
      <div id="placement-board" class="board"></div>
      <div class="controls">
        <button id="rotate-btn">Rotate Ship</button>
        <button id="random-placement-btn">Random Placement</button>
        <button id="confirm-yes-btn" class="hidden">Yes</button>
        <button id="confirm-no-btn" class="hidden">No</button>
        <button id="start-game-btn" class="hidden">Start Game</button>
      </div>
    </div>
    <div id="game-screen" class="hidden">
      <div id="boards-container">
        <div>
          <h2>Your Board</h2>
          <div id="player-board" class="board"></div>
        </div>
        <div>
          <h2>Enemy Board</h2>
          <div id="enemy-board" class="board"></div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
